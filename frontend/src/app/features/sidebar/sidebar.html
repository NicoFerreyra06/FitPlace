<header class="topbar">
  <button
    class="icon-btn"
    type="button"
    aria-label="Abrir menú"
    aria-controls="sidebar"
    [attr.aria-expanded]="menuAbierto()"
    (click)="abrirMenu()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>
  <img class="brand" src="svg/fitplace-logo.svg" alt="FitPlace" />
</header>

<div class="backdrop" [class.visible]="menuAbierto()" (click)="cerrarMenu()"></div>

<aside id="sidebar" class="sidebar" [class.abierto]="menuAbierto()" aria-label="Menú principal">
  <div class="sidebar-header">
    <img class="brand" src="svg/fitplace-logo.svg" alt="FitPlace" />
    <button class="icon-btn cerrar" type="button" aria-label="Cerrar menú" (click)="cerrarMenu()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>

  <nav class="nav">
    <a
      class="item"
      routerLink="/home"
      routerLinkActive="activo"
      ariaCurrentWhenActive="page"
      (click)="cerrarMenu()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
        <path
          d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
        />
      </svg>
      Inicio
    </a>
    <a
      class="item"
      routerLink="/ejercicios"
      routerLinkActive="activo"
      ariaCurrentWhenActive="page"
      (click)="cerrarMenu()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"
        />
        <path d="m2.5 21.5 1.4-1.4M20.1 3.9l1.4-1.4M9.6 14.4l4.8-4.8" />
        <path
          d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"
        />
      </svg>
      Ejercicios
    </a>
    <a
      class="item"
      routerLink="/rutinas"
      routerLinkActive="activo"
      ariaCurrentWhenActive="page"
      (click)="cerrarMenu()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 2h6a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" />
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
        <path d="M12 11h4M12 16h4M8 11h.01M8 16h.01" />
      </svg>
      Mis rutinas
    </a>
    <a
      class="item"
      routerLink="/entrenamientos"
      routerLinkActive="activo"
      ariaCurrentWhenActive="page"
      (click)="cerrarMenu()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
        <path d="M12 7v5l4 2" />
      </svg>
      Mis entrenamientos
    </a>
    <a
      class="item"
      routerLink="/records"
      routerLinkActive="activo"
      ariaCurrentWhenActive="page"
      (click)="cerrarMenu()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.5 15 8.7l6.8 1-4.9 4.8 1.15 6.8L12 18.1l-6.05 3.2 1.15-6.8-4.9-4.8 6.8-1L12 2.5Z" />
      </svg>
      Mis récords
    </a>
    <a
      class="item"
      routerLink="/amigos"
      routerLinkActive="activo"
      ariaCurrentWhenActive="page"
      (click)="cerrarMenu()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
      </svg>
      Amigos
    </a>
    <a
      class="item"
      routerLink="/perfil"
      routerLinkActive="activo"
      ariaCurrentWhenActive="page"
      (click)="cerrarMenu()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
      Mi perfil
    </a>
  </nav>

  <button class="item salir" type="button" (click)="cerrarSesion()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m16 17 5-5-5-5M21 12H9M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
    </svg>
    Cerrar sesión
  </button>
</aside>
